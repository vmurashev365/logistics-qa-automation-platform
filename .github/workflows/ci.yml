name: CI — Core QA Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Type-check, lint and Odoo core checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: http://127.0.0.1:8069
      ODOO_USERNAME: admin
      ODOO_PASSWORD: admin
      ODOO_DATABASE: logistics_qa_db
      HEADLESS: 'true'
      BROWSER: chromium
      DB_ENABLED: 'true'
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DATABASE: logistics_qa_db

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npx playwright install --with-deps chromium

      - name: Start and verify Fleet demo stack
        run: |
          docker compose up -d --wait --wait-timeout 240
          curl --fail --silent --show-error "${BASE_URL}/web/health"
          docker compose exec -T postgres psql -U odoo -d logistics_qa_db -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM fleet_vehicle'

      - name: Run Cucumber core selection
        id: cucumber
        run: npm run test:core

      - name: Run native Chromium smoke checks
        id: chromium
        if: ${{ !cancelled() && steps.cucumber.outcome != 'skipped' && steps.cucumber.outcome != '' }}
        run: npm run test:chromium

      - name: Generate Cucumber HTML report
        if: ${{ !cancelled() && steps.cucumber.outcome != 'skipped' && steps.cucumber.outcome != '' }}
        run: npm run report:cucumber

      - name: Generate Allure HTML report
        if: ${{ !cancelled() && steps.cucumber.outcome != 'skipped' && steps.cucumber.outcome != '' }}
        run: |
          npm run report:allure
          test -s allure-report/index.html

      - name: Upload Cucumber reports
        if: ${{ !cancelled() && steps.cucumber.outcome != 'skipped' && steps.cucumber.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-core-report
          path: reports/cucumber/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Allure HTML report
        if: ${{ !cancelled() && steps.cucumber.outcome != 'skipped' && steps.cucumber.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-core-report
          path: allure-report/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() && steps.chromium.outcome != 'skipped' && steps.chromium.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14

      - name: Summarize report locations
        if: ${{ !cancelled() && steps.cucumber.outcome != 'skipped' && steps.cucumber.outcome != '' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Download the Cucumber, Allure and Chromium HTML reports from the **Artifacts** section of this run.
          Open `cucumber-report.html` for Cucumber's native output or `index.html` for the generated reports.
          EOF

      - name: Show demo stack diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 80
          docker compose exec -T odoo tail -n 80 /var/log/odoo/odoo.log || true
